a<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body {
        font-family: 'Helvetica Neue', Arial, sans-serif;
        background-color: #f4f7f6;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }
      .waku {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        width: 300px;
        text-align: center;
      }
      h2 {
        color: #333;
        margin-bottom: 20px;
      }
      input {
        width: 90%;
        padding: 12px;
        margin-bottom: 20px;
        border: 1px solid #ddd;
        border-radius: 6px;
        font-size: 16px;
        box-sizing: border-box;
      }
      .botan-area {
        position: relative;
        height: 45px;
      }
      button {
        width: 100%;
        padding: 12px;
        background-color: #1a73e8;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
      }
      button:hover {
        background-color: #1557b0;
      }
      .guruguru {
        display: none;
        width: 25px;
        height: 25px;
        border: 3px solid #f3f3f3;
        border-top: 3px solid #1a73e8;
        border-radius: 50%;
        animation: mawa-su 1s linear infinite;
        margin: 10px auto 0;
      }
      @keyframes mawa-su {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      #bunshou {
        color: #d93025;
        font-size: 14px;
        margin-top: 15px;
        min-height: 20px;
      }
    </style>
  </head>
  <body>

    <div class="waku">
      <h2>テスト</h2>
      <input type="password" id="nyuryoku" placeholder="パスワードを入力" autocomplete="new-password" onkeypress="if(event.key==='Enter')kakunin()">
      
      <div class="botan-area">
        <button id="oshite" onclick="kakunin()">ログイン</button>
        <div id="ugoki" class="guruguru"></div>
      </div>
      
      <div id="bunshou"></div>
    </div>

    <script>
      function kakunin() {
        const pass = document.getElementById('nyuryoku').value;
        const botan = document.getElementById('oshite');
        const ugoki = document.getElementById('ugoki');
        const moji = document.getElementById('bunshou');

        // ボタンを隠して、少しの間だけ待機中っぽく見せる
        botan.style.display = 'none';
        ugoki.style.display = 'block';
        moji.innerText = "";

        // パスワードのチェック
        setTimeout(() => {
          if (pass === "index") {
            moji.style.color = "#188038";
            moji.innerText = "しばらくお待ち下さい...";
            window.location.href = "https://google.com";
          } else {
            botan.style.display = 'block';
            ugoki.style.display = 'none';
            moji.innerText = "パスワードが正しくありません";
          }
        }, 600); // 0.6秒だけ待ち時間を演出
      }
    </script>

  </body>
</html>
